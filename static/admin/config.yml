backend:
  name: git-gateway
  branch: master

publish_mode: editorial_workflow

media_folder: "static/uploads"
public_folder: "/uploads"

# ─────────────────────────────────────────────────────────────────────────────
# COLLECTIONS
# ─────────────────────────────────────────────────────────────────────────────

collections:

  # ── 1. HOMEPAGE ──────────────────────────────────────────────────────────────
  # All homepage content in one place: bio, sections, social links.
  # The live preview on the right shows the complete homepage as it will appear.
  - name: "homepage"
    label: "🏠 Homepage"
    description: "Everything on the home page — bio, section lists, social links."
    files:

      - name: "homepage"
        label: "Homepage"
        description: "Edit your name, bio, speaking info, all section lists, and social links."
        file: "content/config/homepage.json"
        format: "json"
        fields:

          # ── Profile ──────────────────────────────────────────────────────────
          - label: "Your Name"
            name: "name"
            widget: "string"
            hint: "Large h1 heading at the top of the page."
          - label: "Full Headline"
            name: "headline"
            widget: "string"
            hint: "Shown on desktop. Example: Product Leader | Speaker | Mentor"
          - label: "Short Headline"
            name: "shortHeadline"
            widget: "string"
            hint: "Shown on mobile. Example: PM | Speaker | Mentor"
          - label: "Bio"
            name: "bio"
            widget: "text"
            hint: "The paragraph in the About section."
          - label: "Speaking Text"
            name: "speakingText"
            widget: "text"
            hint: "The sentence in the Speaking section, before your email address."
          - label: "Contact Email"
            name: "email"
            widget: "string"
            hint: "Shown as a mailto link at the end of the Speaking section."
          - label: "SEO Description"
            name: "seoDescription"
            widget: "text"
            hint: "Used only for search engine previews — not visible on the page itself."
          - label: "Site URL"
            name: "siteUrl"
            widget: "string"
            hint: "Full production URL, e.g. https://www.ryanluu.com. Used for the copy-link button."
          - label: "Info Panel — Title"
            name: "infoTitle"
            widget: "string"
            hint: "Answer to 'What is this?' in the ℹ️ info panel."
          - label: "Info Panel — Why Familiar?"
            name: "infoFamiliar"
            widget: "text"
            hint: "Answer to 'Why does this look familiar?' in the ℹ️ info panel."
          - label: "Info Panel — How Was It Built?"
            name: "infoBuilt"
            widget: "text"
            hint: "Answer to 'How was it built?' in the ℹ️ info panel."

          # ── Section lists ─────────────────────────────────────────────────────
          - name: "section_writing"
            label: "Writing Section"
            widget: "object"
            hint: "The Writing section items on the home page."
            fields:
              - { label: "Section Key", name: "section", widget: "hidden", default: "writing" }
              - name: "items"
                label: "Writing Items"
                widget: "list"
                summary: "{{fields.homeLabel}}"
                fields: &page_item_fields
                  - label: "Home Page Label"
                    name: "homeLabel"
                    widget: "string"
                    hint: "Text shown as a link on the home page. Convention: start with +."
                  - label: "Nav Title"
                    name: "title"
                    widget: "string"
                    hint: "Shown in the sidebar and top nav bar when on this page."
                  - label: "URL Path"
                    name: "path"
                    widget: "string"
                    hint: "Must start and end with /. Example: /journaldaily/"
                  - label: "Anchor ID"
                    name: "anchorId"
                    widget: "string"
                    hint: "Path without slashes. Example: journaldaily"
                  - label: "Status"
                    name: "status"
                    widget: "select"
                    options:
                      - { label: "Published", value: "published" }
                      - { label: "Coming Soon (shows label, no link)", value: "coming-soon" }
                      - { label: "Draft (hidden)", value: "draft" }
                    default: "published"
                  - label: "Hover Popup Label"
                    name: "popupText"
                    widget: "string"
                    required: false
                    hint: "Short label in the hover preview. Example: Blog Post: Journal Daily"
                  - label: "Hover Popup Image Key"
                    name: "popupImage"
                    widget: "string"
                    required: false
                    hint: "Image key for hover preview. Leave blank if none."

          - name: "section_product"
            label: "Product Management Section"
            widget: "object"
            hint: "The Product Management section items on the home page."
            fields:
              - { label: "Section Key", name: "section", widget: "hidden", default: "product" }
              - name: "items"
                label: "Product Items"
                widget: "list"
                summary: "{{fields.homeLabel}}"
                fields: *page_item_fields

          - name: "section_development"
            label: "Development Section"
            widget: "object"
            hint: "The Development section items on the home page."
            fields:
              - { label: "Section Key", name: "section", widget: "hidden", default: "development" }
              - name: "items"
                label: "Development Items"
                widget: "list"
                summary: "{{fields.homeLabel}}"
                fields: *page_item_fields

          # ── Social links ──────────────────────────────────────────────────────
          - name: "social"
            label: "Social Links"
            widget: "object"
            hint: "The social links in the web links panel."
            fields:
              - name: "items"
                label: "Links"
                widget: "list"
                summary: "{{fields.label}} — {{fields.url}}"
                fields:
                  - label: "Platform"
                    name: "platform"
                    widget: "select"
                    options:
                      - { label: "Twitter / X", value: "twitter" }
                      - { label: "LinkedIn",    value: "linkedin" }
                      - { label: "GitHub",       value: "github" }
                    hint: "Controls which icon is shown."
                  - label: "Link Label"
                    name: "label"
                    widget: "string"
                    hint: "The visible text of the link. Example: Twitter"
                  - label: "URL"
                    name: "url"
                    widget: "string"
                    hint: "Full URL. Example: https://twitter.com/ryanluu"

  # ── 2. WRITING ────────────────────────────────────────────────────────────────
  - name: "writing"
    label: "✍️ Writing"
    label_singular: "Post"
    description: "Blog posts. Editing sections here updates their text content."
    folder: "content/writing"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{status}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "URL Path"
        name: "path"
        widget: "string"
        hint: "Must start and end with /. Example: /journaldaily/ — also add this to the Writing Section list on the Homepage."
      - { label: "Slug", name: "slug", widget: "string", hint: "URL-safe version of the title. Example: journaldaily" }
      - { label: "SEO Title", name: "seoTitle", widget: "string" }
      - label: "Status"
        name: "status"
        widget: "select"
        options:
          - { label: "Published", value: "published" }
          - { label: "Draft (not linked yet)", value: "draft" }
        default: "draft"
      - { label: "Intro Text", name: "intro", widget: "text", required: false, hint: "Optional intro paragraph shown before the sections." }
      - name: "sections"
        label: "Sections"
        widget: "list"
        summary: "{{fields.title}}"
        allow_add: true
        fields:
          - { label: "Section Title", name: "title", widget: "string" }
          - { label: "Section Text", name: "text", widget: "text" }
          - { label: "Section ID (anchor)", name: "id", widget: "string", hint: "Lowercase, no spaces. Example: key-takeaways" }

  # ── 3. PRODUCT ────────────────────────────────────────────────────────────────
  - name: "product"
    label: "📋 Product Case Studies"
    label_singular: "Case Study"
    description: "Product management case studies."
    folder: "content/product"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{status}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "URL Path"
        name: "path"
        widget: "string"
        hint: "Must start and end with /. Example: /adhoc/ — also add this to the Product Section on the Homepage."
      - { label: "Slug", name: "slug", widget: "string", hint: "URL-safe version. Example: adhoc" }
      - { label: "SEO Title", name: "seoTitle", widget: "string" }
      - label: "Status"
        name: "status"
        widget: "select"
        options:
          - { label: "Published", value: "published" }
          - { label: "Coming Soon", value: "coming-soon" }
          - { label: "Draft (not linked yet)", value: "draft" }
        default: "draft"
      - { label: "Role", name: "role", widget: "string", required: false }
      - { label: "Team", name: "team", widget: "string", required: false }
      - { label: "Tools", name: "tools", widget: "string", required: false }
      - { label: "Timeline", name: "timeline", widget: "string", required: false }
      - { label: "YouTube Video ID", name: "ytid", widget: "string", required: false }
      - { label: "← Prev Page Title", name: "prevTitle", widget: "string", required: false }
      - { label: "← Prev Page Path",  name: "prevPath",  widget: "string", required: false }
      - { label: "→ Next Page Title", name: "nextTitle", widget: "string", required: false }
      - { label: "→ Next Page Path",  name: "nextPath",  widget: "string", required: false }
      - { label: "Next Page is Coming Soon?", name: "nextComingSoon", widget: "boolean", default: false }
      - name: "sections"
        label: "Sections"
        widget: "list"
        summary: "{{fields.title}}"
        allow_add: true
        fields:
          - { label: "Section Title", name: "title", widget: "string" }
          - { label: "Section Text",  name: "text",  widget: "text" }
          - { label: "Section ID (anchor)", name: "id", widget: "string", hint: "Lowercase, no spaces. Example: background" }

  # ── 4. DEVELOPMENT ────────────────────────────────────────────────────────────
  - name: "development"
    label: "💻 Development Case Studies"
    label_singular: "Case Study"
    description: "Development case studies."
    folder: "content/development"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{status}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "URL Path"
        name: "path"
        widget: "string"
        hint: "Must start and end with /. Example: /openrecord/ — also add this to the Development Section on the Homepage."
      - { label: "Slug", name: "slug", widget: "string", hint: "URL-safe version. Example: openrecord" }
      - { label: "SEO Title", name: "seoTitle", widget: "string" }
      - label: "Status"
        name: "status"
        widget: "select"
        options:
          - { label: "Published", value: "published" }
          - { label: "Coming Soon", value: "coming-soon" }
          - { label: "Draft (not linked yet)", value: "draft" }
        default: "draft"
      - { label: "Client",   name: "client",   widget: "string", required: false }
      - { label: "Role",     name: "role",     widget: "string", required: false }
      - { label: "Team",     name: "team",     widget: "string", required: false }
      - { label: "Tools",    name: "tools",    widget: "string", required: false }
      - { label: "Timeline", name: "timeline", widget: "string", required: false }
      - { label: "YouTube Video ID", name: "ytid", widget: "string", required: false }
      - { label: "← Prev Page Title", name: "prevTitle", widget: "string", required: false }
      - { label: "← Prev Page Path",  name: "prevPath",  widget: "string", required: false }
      - { label: "→ Next Page Title", name: "nextTitle", widget: "string", required: false }
      - { label: "→ Next Page Path",  name: "nextPath",  widget: "string", required: false }
      - { label: "Next Page is Coming Soon?", name: "nextComingSoon", widget: "boolean", default: false }
      - name: "sections"
        label: "Sections"
        widget: "list"
        summary: "{{fields.title}}"
        allow_add: true
        fields:
          - { label: "Section Title", name: "title", widget: "string" }
          - { label: "Section Text",  name: "text",  widget: "text" }
          - { label: "Section ID (anchor)", name: "id", widget: "string", hint: "Lowercase, no spaces. Example: background" }
