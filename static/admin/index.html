<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
  <style>
    /* Draggable divider — lives in the CMS parent document, not the preview iframe */
    #cms-drag-divider {
      align-items: center;
      background: #171B21;
      border-left: 1px solid #3f4755;
      border-right: 1px solid #3f4755;
      cursor: col-resize;
      display: flex !important;
      flex: 0 0 8px !important;
      justify-content: center;
      position: relative;
      transition: background 0.15s;
      z-index: 9999;
    }
    #cms-drag-divider:hover,
    #cms-drag-divider.dragging {
      background: #232c3a;
    }
    #cms-drag-divider:hover .drag-pill,
    #cms-drag-divider.dragging .drag-pill {
      background: #72b6ec;
    }
    .drag-pill {
      background: #3f4755;
      border-radius: 4px;
      height: 40px;
      pointer-events: none;
      transition: background 0.15s;
      width: 4px;
    }
    #drag-overlay {
      bottom: 0;
      cursor: col-resize;
      left: 0;
      position: fixed;
      right: 0;
      top: 0;
      z-index: 99999;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.registerPreviewStyle('/admin/preview.css');

    // ── Helpers ──────────────────────────────────────────────────────────────
    // Safe getter for both Immutable.js Maps and plain objects
    function itemGet(item, key) {
      if (!item) return '';
      if (typeof item.get === 'function') return item.get(key) || '';
      return item[key] || '';
    }

    // Convert Immutable List or plain Array to a real Array
    function toArr(list) {
      if (!list) return [];
      if (typeof list.toArray === 'function') return list.toArray();
      if (Array.isArray(list)) return list;
      return [];
    }

    );

    // Info (?) icon (matches info-icon.inline.svg)
    var InfoIconSVG = h('svg', { xmlns: 'http://www.w3.org/2000/svg', width: '22', height: '22', viewBox: '0 0 22 22', fill: 'none' },

    );

    // ── Static fallbacks for non-homepage previews ────────────────────────────
    var STATIC_SOCIAL = [
      { platform: 'twitter',  label: 'Twitter',  url: 'https://twitter.com/rtluu' },
      { platform: 'linkedin', label: 'LinkedIn', url: 'https://linkedin.com/in/ryanluu' },
      { platform: 'github',   label: 'Github',   url: 'https://github.com/rtluu' }
    ];
    var STATIC_INFO_TITLE    = 'Ryan Luu\u2019s Portfolio & Blog';
    var STATIC_INFO_FAMILIAR = 'The design mimics Dropbox Paper, a tool I use daily for writing and collaboration.';
    var STATIC_INFO_BUILT    = 'This site was custom coded with React Hooks and Gatsby, and is hosted on Netlify.';

    var PLATFORM_ICONS = { twitter: TwitterIconSVG, linkedin: LinkedinIconSVG, github: GithubIconSVG };

    // Renders the Social web-links drawer (inside footer-inner.left)
    function renderSocial(socialOpen, onToggle, links) {
      return h('div', { className: 'social-container' + (socialOpen ? ' show' : '') },
        h('button', { className: 'icon social-button', onClick: onToggle }, WebIconSVG),
        h('div', { className: 'social-inner' },
          h('h3', { className: 'social-header' }, 'Web Links'),
          h('ul', { className: 'social-list' },
            links.map(function(link) {
              var platform = itemGet(link, 'platform');
              var label    = itemGet(link, 'label');
              var url      = itemGet(link, 'url');
              return h('a', { href: url, key: platform || label },
                h('li', null,
                  h('span', { className: 'social-icon' }, PLATFORM_ICONS[platform] || null),
                  h('h5', null, label)
                )
              );
            })
          )
        )
      );
    }

    // Renders the fixed Info (?) button + popup
    function renderInfo(infoOpen, onToggle, infoTitle, infoFamiliar, infoBuilt) {
      return h('div', { className: 'info-container' + (infoOpen ? ' show' : '') },
        h('button', { className: 'icon info-button', onClick: onToggle }, InfoIconSVG),
        h('div', { className: 'info-inner' },
          h('h3', { className: 'info-header' }, 'Site Info'),
          h('div', { className: 'info-qa' },
            h('h4', { className: 'question' }, 'What is this?'),
            h('h5', { className: 'answer' }, infoTitle || '')
          ),
          h('div', { className: 'info-qa' },
            h('h4', { className: 'question' }, 'Why does this look familiar?'),
            h('h5', { className: 'answer' }, infoFamiliar || '')
          ),
          h('div', { className: 'info-qa' },
            h('h4', { className: 'question' }, 'How was it built?'),
            h('h5', { className: 'answer' }, infoBuilt || '')
          )
        )
      );
    }

    function ArrowSVG(rotated) {
      return h('svg', { xmlns: 'http://www.w3.org/2000/svg', width: '8', height: '8', viewBox: '0 0 8 8',
                        style: { transform: rotated ? 'rotate(90deg)' : 'rotate(0deg)', transition: '0.2s all', display: 'block' } },
        h('path', { d: 'M2 1l4 3-4 3V1z', fill: '#a5a9af' })
      );
    }

    // ── Shared sub-renderers ─────────────────────────────────────────────────
    function renderFolderGroup(title, items, activePath) {
      return h('div', { className: 'folder-group' },
        h('div', { className: 'folder-title' },
          FolderIconSVG,
          h('h4', { className: 'bold' }, title)
        ),
        h('ul', { className: 'folder-list' },
          items.map(function(item) {
            var t      = itemGet(item, 'title');
            var p      = itemGet(item, 'path');
            var status = itemGet(item, 'status');
            if (status === 'draft') return null;
            var isActive = activePath && p && activePath === p;
            var isGray   = status === 'coming-soon';
            return h('li', { key: p || t, className: isActive ? 'active' : '' },
              h('span', { className: 'paper-icon' + (isGray ? ' wapo' : '') },
                isGray ? PaperIconGraySVG : PaperIconSVG
              ),
              isGray
                ? h('h5', null, t, h('span', { className: 'italic space-left' }, '(coming soon)'))
                : h('h5', null, t)
            );
          }).filter(Boolean)
        )
      );
    }

    function renderSidebar(menuOpen, onToggle, writingItems, productItems, devItems, activePath) {
      return h('div', { className: 'menu' + (menuOpen ? ' open' : '') },
        h('div', { className: 'menu-header' },
          h('button', { className: 'icon home', title: 'Back to home' }, HomeIconSVG)
        ),
        renderFolderGroup('Writing',     writingItems, activePath),
        renderFolderGroup('Product',     productItems, activePath),
        renderFolderGroup('Development', devItems,     activePath)
      );
    }

    function renderNav(menuOpen, onToggle, pageName, subTitle, showBack) {
      return h('nav', { className: 'nav' + (menuOpen ? ' open' : '') },
        h('div', { className: 'nav-inner-box left' },
          h('div', { className: 'button-box' },
            showBack && h('button', { className: 'icon back-arrow', title: 'Back' }, BackIconSVG),
            h('button', { className: 'icon sidebar', title: 'Toggle sidebar', onClick: onToggle },
              SidebarIconSVG
            )
          )
        ),
        h('div', { className: 'nav-inner-box center' },
          h('div', { className: 'nav-link-box' },
            h('h6', { className: 'nav-anchor' }, pageName  || 'Ryan Luu'),
            h('h6', { className: 'nav-link'   }, subTitle || 'Personal Site')
          )
        ),
        h('div', { className: 'nav-inner-box right' },
          h('div', { className: 'button-box' },
            h('button', { className: 'icon copy-link',  title: 'Copy link'   }, LinkIconSVG),
            h('button', { className: 'icon light-mode', title: 'Light mode'  }, LightIconSVG)
          )
        )
      );
    }

    function renderFooter(socialOpen, onSocialToggle, links) {
      return h('footer', { className: 'footer' },
        h('div', { className: 'footer-inner left' },
          renderSocial(socialOpen || false, onSocialToggle || function(){}, links || [])
        ),
        h('div', { className: 'footer-inner center' },
          h('a', { href: '/' },
            h('h6', { className: 'copyright' }, '\u00A9 ' + new Date().getFullYear() + ' RL')
          )
        )
      );
    }

    // ── Static nav fallback (used in case-study previews) ────────────────────
    var NAV_WRITING = [
      { title: 'Journal Daily',    path: '/journaldaily/', status: 'published' },
      { title: 'Remote Work',      path: '/remotework/',   status: 'published' }
    ];
    var NAV_PRODUCT = [
      { title: 'Washington Post',  path: '/washingtonpost/', status: 'coming-soon' },
      { title: 'Ad Hoc',           path: '/adhoc/',           status: 'published' },
      { title: 'Vumble',           path: '/vumble/',          status: 'published' }
    ];
    var NAV_DEV = [
      { title: 'OpenRecord',       path: '/openrecord/',      status: 'published' },
      { title: 'Neat',             path: '/neat/',            status: 'published' },
      { title: 'OurLuuBeginning',  path: '/ourluubeginning/', status: 'published' },

    // ── Info portal helpers (DOM-inject into iframe body to bypass any CSS-transform containment) ──
    var _INFO_PORTAL_ID = 'cms-info-portal';

    function _buildInfoHTML(isOpen, infoTitle, infoFamiliar, infoBuilt) {
      var t = (infoTitle    || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      var f = (infoFamiliar || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      var b = (infoBuilt    || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      var innerStyle = isOpen ? 'opacity:1;pointer-events:all;transform:translateY(calc(-100% - 3.5rem))' : '';
      return (
        '<button class="icon info-button" id="cms-info-toggle" style="pointer-events:all">' +
          '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22" fill="none">' +
            '<path fill-rule="evenodd" clip-rule="evenodd" d="M22 11C22 17.0751 17.0751 22 11 22C4.92487 22 0 17.0751 0 11C0 4.92487 4.92487 0 11 0C17.0751 0 22 4.92487 22 11ZM11 20.0299C15.987 20.0299 20.0299 15.987 20.0299 11C20.0299 6.01295 15.987 1.97015 11 1.97015C6.01295 1.97015 1.97015 6.01295 1.97015 11C1.97015 15.987 6.01295 20.0299 11 20.0299Z" fill="#A5A9AF"/>' +
            '<path d="M12.5979 8.55109C12.5979 9.25078 12.2797 9.64683 11.7495 10.0825L11.0336 10.6766C10.331 11.2706 10.1454 11.4687 10.1454 12.3136V13.1585H11.7097V12.5644C11.7097 12.1023 11.829 11.9835 12.2002 11.6799L12.9558 11.0594C13.7645 10.3861 14.3478 9.72604 14.3478 8.45868C14.3478 7.01969 13.3933 5.73913 11.1131 5.73913C8.89922 5.73913 7.6133 7.16491 7.65307 9.22437H9.36322C9.34996 7.77219 10.0791 7.16491 11.0999 7.16491C12.0411 7.16491 12.5979 7.73258 12.5979 8.55109Z" fill="#A5A9AF"/>' +
            '<path d="M11.9483 16.2609V14.4126H9.89349V16.2609H11.9483Z" fill="#A5A9AF"/>' +
          '</svg>' +
        '</button>' +
        '<div class="info-inner"' + (innerStyle ? ' style="' + innerStyle + '"' : '') + '>' +
          '<h3 class="info-header">Site Info</h3>' +
          '<div class="info-qa"><h4 class="question">What is this?</h4><h5 class="answer">' + t + '</h5></div>' +
          '<div class="info-qa"><h4 class="question">Why does this look familiar?</h4><h5 class="answer">' + f + '</h5></div>' +
          '<div class="info-qa"><h4 class="question">How was it built?</h4><h5 class="answer">' + b + '</h5></div>' +
        '</div>'
      );
    }

    function _infoPortalMount(self) {
      // self.base is Preact's root DOM node for this component — it lives inside
      // the preview iframe, so ownerDocument gives us the iframe's document,
      // not the parent CMS page document.
      var ownerDoc = (self.base && self.base.ownerDocument) || document;
      if (ownerDoc.getElementById(_INFO_PORTAL_ID)) return;
      var el = ownerDoc.createElement('div');
      el.id        = _INFO_PORTAL_ID;
      el.className = 'info-container';
      el.style.cssText = 'bottom:0;left:0;pointer-events:none;position:fixed;width:100%;z-index:9999';
      ownerDoc.body.appendChild(el);
      self._isInfoPortalOwner = true;
      self._infoOwnerDoc = ownerDoc;
      _infoPortalUpdate(self);
    }

    function _infoPortalUpdate(self) {
      var ownerDoc = self._infoOwnerDoc || (self.base && self.base.ownerDocument) || document;
      var el = ownerDoc.getElementById(_INFO_PORTAL_ID);
      if (!el) return;
      var isOpen = !!(self.state && self.state.infoOpen);
      var t = self._infoTitle    || STATIC_INFO_TITLE;
      var f = self._infoFamiliar || STATIC_INFO_FAMILIAR;
      var b = self._infoBuilt    || STATIC_INFO_BUILT;
      el.className     = 'info-container' + (isOpen ? ' show' : '');
      el.style.cssText = 'bottom:0;left:0;pointer-events:none;position:fixed;width:100%;z-index:9999';
      el.innerHTML     = _buildInfoHTML(isOpen, t, f, b);
      var btn = ownerDoc.getElementById('cms-info-toggle');
      if (btn) btn.onclick = function() { self.setState({ infoOpen: !self.state.infoOpen }); };
    }

    function _infoPortalUnmount(self) {
      if (!self._isInfoPortalOwner) return;
      var ownerDoc = self._infoOwnerDoc || document;
      var el = ownerDoc.getElementById(_INFO_PORTAL_ID);
      if (el && el.parentNode) el.parentNode.removeChild(el);
    }

    // ── Draggable divider between editor and preview panes ───────────────────
    (function() {
      var dragging = false;
      var originX  = 0;
      var originW  = 0;
      var contW    = 0;

      function findSplit() {
        var iframes = document.querySelectorAll('iframe');
        for (var i = 0; i < iframes.length; i++) {
          var el = iframes[i];
          // Walk up to find the 2-child flex container
          for (var depth = 0; depth < 4; depth++) {
            el = el.parentElement;
            if (!el) break;
            if (el.children.length === 2) {
              var r = el.getBoundingClientRect();
              if (r.width > 400 && r.height > 200) {
                return { container: el, left: el.children[0], right: el.children[1] };
              }
            }
          }
        }
        return null;
      }

      function inject() {
        if (document.getElementById('cms-drag-divider')) return;
        var found = findSplit();
        if (!found) return;

        var container = found.container;
        var leftPane  = found.left;
        var rightPane = found.right;

        container.style.display       = 'flex';
        container.style.flexDirection = 'row';

        var divider = document.createElement('div');
        divider.id = 'cms-drag-divider';
        divider.innerHTML = '<div class="drag-pill"></div>';
        container.insertBefore(divider, rightPane);

        var pill = divider.querySelector('.drag-pill');

        divider.addEventListener('mousedown', function(evt) {
          evt.preventDefault();
          dragging = true;
          originX  = evt.clientX;
          originW  = leftPane.getBoundingClientRect().width;
          contW    = container.getBoundingClientRect().width;
          divider.classList.add('dragging');

          // Overlay prevents the iframe swallowing mouse events during drag
          var ov = document.createElement('div');
          ov.id = 'drag-overlay';
          document.body.appendChild(ov);
        });

        document.addEventListener('mousemove', function(evt) {
          if (!dragging) return;
          var min  = 300;
          var max  = contW - 320;
          var newW = Math.max(min, Math.min(max, originW + (evt.clientX - originX)));
          leftPane.style.flex     = '0 0 ' + newW + 'px';
          leftPane.style.minWidth = newW + 'px';
          leftPane.style.maxWidth = newW + 'px';
        });

        document.addEventListener('mouseup', function() {
          if (!dragging) return;
          dragging = false;
          divider.classList.remove('dragging');
          var ov = document.getElementById('drag-overlay');
          if (ov) ov.parentNode.removeChild(ov);
        });
      }

      var observer = new MutationObserver(function() {
        if (!document.getElementById('cms-drag-divider')) inject();
      });
      observer.observe(document.body, { childList: true, subtree: true });
      [400, 1000, 2000, 3500].forEach(function(ms) { setTimeout(inject, ms); });
    })();
  </script>
